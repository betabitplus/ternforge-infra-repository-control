name: repository control

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SCALR_HOSTNAME: betabitplus-ternforge.scalr.io
  SCALR_SA_EMAIL: ternforge-repository-control-github@betabitplus-ternforge.scalr.io
  SCALR_CLI_VERSION: 0.18.0
  SCALR_WORKSPACE_ID: ws-v0pc7dbrm7g2p3aat
  FROZEN_BASELINE_SHA: d59582375855cff69fb165e467dc5847bc75ca99

concurrency:
  group: repository-control-apply
  cancel-in-progress: false

jobs:
  plan:
    name: repository control / plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: repository-control-apply
    outputs:
      plan_digest: ${{ steps.plan.outputs.digest }}
    steps:
      - name: Verify repository-control environment protections
        env:
          GH_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/repository-control-apply")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              "protected_branches": false,
              "custom_branch_policies": true
            } and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .reviewers[] |
              {type, login: .reviewer.login}
            ] == [{"type": "User", "login": $owner}])
          ' <<<"$environment_json" >/dev/null

          branch_policies_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/repository-control-apply/deployment-branch-policies")"
          jq -e '
            .total_count == 1 and
            (.branch_policies | length) == 1 and
            .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"
          ' <<<"$branch_policies_json" >/dev/null

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install pinned Scalr CLI
        run: |
          set -euo pipefail
          base="https://github.com/Scalr/scalr-cli/releases/download/v${SCALR_CLI_VERSION}"
          archive="scalr-cli_${SCALR_CLI_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS"
          grep " ${archive}$" "scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS" | sha256sum --check --strict
          unzip -q "$archive"
          sudo install -m 0755 scalr /usr/local/bin/scalr
          scalr -version
          rm -f "$archive" "scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS" scalr

      - name: Exchange GitHub OIDC for a 600-second Scalr credential
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=betabitplus")"
          oidc="$(jq -er '.value' <<<"$response")"
          echo "::add-mask::$oidc"
          scalr -quiet assume-service-account \
            -id-token="$oidc" \
            -service-account-email="$SCALR_SA_EMAIL" \
            -lifetime=600
          test -s "$HOME/.terraform.d/credentials.tfrc.json"
          jq -e --arg host "$SCALR_HOSTNAME" \
            '.credentials[$host].token | type == "string" and length > 20' \
            "$HOME/.terraform.d/credentials.tfrc.json" >/dev/null

      - name: Read back state-only Scalr workspace
        run: |
          set -euo pipefail
          scalr -format=json get-workspace -workspace="$SCALR_WORKSPACE_ID" > workspace.json
          jq -e '
            ."execution-mode" == "local" and
            .operations == false and
            ."remote-backend" == true and
            ."iac-platform" == "opentofu" and
            ."terraform-version" == "1.12.5" and
            (."vcs-repo" == null or ."vcs-repo" == {})
          ' workspace.json >/dev/null
          scalr -format=json get-runs -filter-workspace="$SCALR_WORKSPACE_ID" > runs.json
          jq -e 'length == 0' runs.json >/dev/null
          scalr -format=json get-variables -filter-workspace="$SCALR_WORKSPACE_ID" > variables.json
          jq -e 'length == 0' variables.json >/dev/null
          scalr -format=json list-provider-configuration-links -workspace="$SCALR_WORKSPACE_ID" > provider-links.json
          jq -e 'length == 0' provider-links.json >/dev/null
          rm -f workspace.json runs.json variables.json provider-links.json

      - name: Verify repository-control PAT scopes and frozen baseline
        env:
          GITHUB_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
          GH_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -D headers.txt -o /dev/null \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user
          scopes="$(awk -F': ' 'tolower($1)=="x-oauth-scopes" {gsub("\r", "", $2); print $2}' headers.txt)"
          rm -f headers.txt
          actual_scopes="$(printf '%s\n' "$scopes" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sort | paste -sd, -)"
          expected_scopes="read:user,repo"
          test "$actual_scopes" = "$expected_scopes" || {
            printf 'Unexpected classic PAT scopes: %s\n' "$scopes" >&2
            exit 1
          }
          baseline="$(gh api repos/betabitplus/py-lib-starter/commits/dev --jq '.sha')"
          test "$baseline" = "$FROZEN_BASELINE_SHA"

      - name: Initialize remote state
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -input=false -lockfile=readonly
          tofu validate

      - name: Build reviewed repository-control plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          tofu plan -input=false -out=repository-control.plan
          tofu show -no-color repository-control.plan > repository-control-plan.txt
          tofu show -json repository-control.plan > repository-control-plan.json
          digest="$(jq -cS \
            '[.resource_changes[]? | select(.change.actions != ["no-op"] or .change.importing != null)] | sort_by(.address)' \
            repository-control-plan.json | sha256sum | cut -d' ' -f1)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Repository-control plan'
            echo
            printf 'Canonical resource changes digest: %s\n\n' "$digest"
            echo '```text'
            cat repository-control-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f repository-control.plan repository-control-plan.txt repository-control-plan.json

  apply:
    name: repository control / apply
    if: github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: repository-control-apply
    steps:
      - name: Verify repository-control environment protections
        env:
          GH_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/repository-control-apply")"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '
            .can_admins_bypass == false and
            .deployment_branch_policy == {
              "protected_branches": false,
              "custom_branch_policies": true
            } and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .reviewers[] |
              {type, login: .reviewer.login}
            ] == [{"type": "User", "login": $owner}])
          ' <<<"$environment_json" >/dev/null

          branch_policies_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/repository-control-apply/deployment-branch-policies")"
          jq -e '
            .total_count == 1 and
            (.branch_policies | length) == 1 and
            .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"
          ' <<<"$branch_policies_json" >/dev/null

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install pinned Scalr CLI
        run: |
          set -euo pipefail
          base="https://github.com/Scalr/scalr-cli/releases/download/v${SCALR_CLI_VERSION}"
          archive="scalr-cli_${SCALR_CLI_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS"
          grep " ${archive}$" "scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS" | sha256sum --check --strict
          unzip -q "$archive"
          sudo install -m 0755 scalr /usr/local/bin/scalr
          scalr -version
          rm -f "$archive" "scalr-cli_${SCALR_CLI_VERSION}_SHA256SUMS" scalr

      - name: Exchange GitHub OIDC for a 600-second Scalr credential
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=betabitplus")"
          oidc="$(jq -er '.value' <<<"$response")"
          echo "::add-mask::$oidc"
          scalr -quiet assume-service-account \
            -id-token="$oidc" \
            -service-account-email="$SCALR_SA_EMAIL" \
            -lifetime=600
          test -s "$HOME/.terraform.d/credentials.tfrc.json"
          jq -e --arg host "$SCALR_HOSTNAME" \
            '.credentials[$host].token | type == "string" and length > 20' \
            "$HOME/.terraform.d/credentials.tfrc.json" >/dev/null

      - name: Read back state-only Scalr workspace
        run: |
          set -euo pipefail
          scalr -format=json get-workspace -workspace="$SCALR_WORKSPACE_ID" > workspace.json
          jq -e '
            ."execution-mode" == "local" and
            .operations == false and
            ."remote-backend" == true and
            ."iac-platform" == "opentofu" and
            ."terraform-version" == "1.12.5" and
            (."vcs-repo" == null or ."vcs-repo" == {})
          ' workspace.json >/dev/null
          scalr -format=json get-runs -filter-workspace="$SCALR_WORKSPACE_ID" > runs.json
          jq -e 'length == 0' runs.json >/dev/null
          scalr -format=json get-variables -filter-workspace="$SCALR_WORKSPACE_ID" > variables.json
          jq -e 'length == 0' variables.json >/dev/null
          scalr -format=json list-provider-configuration-links -workspace="$SCALR_WORKSPACE_ID" > provider-links.json
          jq -e 'length == 0' provider-links.json >/dev/null
          rm -f workspace.json runs.json variables.json provider-links.json

      - name: Verify repository-control PAT scopes and frozen baseline
        env:
          GITHUB_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
          GH_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -D headers.txt -o /dev/null \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user
          scopes="$(awk -F': ' 'tolower($1)=="x-oauth-scopes" {gsub("\r", "", $2); print $2}' headers.txt)"
          rm -f headers.txt
          actual_scopes="$(printf '%s\n' "$scopes" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | sort | paste -sd, -)"
          expected_scopes="read:user,repo"
          test "$actual_scopes" = "$expected_scopes" || {
            printf 'Unexpected classic PAT scopes: %s\n' "$scopes" >&2
            exit 1
          }
          baseline="$(gh api repos/betabitplus/py-lib-starter/commits/dev --jq '.sha')"
          test "$baseline" = "$FROZEN_BASELINE_SHA"

      - name: Initialize remote state
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -input=false -lockfile=readonly
          tofu validate

      - name: Re-plan, verify reviewed digest, and apply
        env:
          GITHUB_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
          REVIEWED_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
        run: |
          set -euo pipefail
          tofu plan -input=false -out=repository-control.plan
          tofu show -json repository-control.plan > repository-control-plan.json
          digest="$(jq -cS \
            '[.resource_changes[]? | select(.change.actions != ["no-op"] or .change.importing != null)] | sort_by(.address)' \
            repository-control-plan.json | sha256sum | cut -d' ' -f1)"
          test "$digest" = "$REVIEWED_PLAN_DIGEST" || {
            printf 'Plan changed after review: reviewed=%s current=%s\n' "$REVIEWED_PLAN_DIGEST" "$digest" >&2
            exit 1
          }
          tofu apply -input=false repository-control.plan
          rm -f repository-control.plan repository-control-plan.json

      - name: Prove no drift and frozen baseline integrity
        env:
          GITHUB_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
          GH_TOKEN: ${{ secrets.TERNFORGE_REPOSITORY_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          tofu plan -detailed-exitcode -input=false > no-drift.txt
          code=$?
          set -e
          cat no-drift.txt
          rm -f no-drift.txt
          test "$code" -eq 0
          baseline="$(gh api repos/betabitplus/py-lib-starter/commits/dev --jq '.sha')"
          test "$baseline" = "$FROZEN_BASELINE_SHA"
          scalr -format=json get-runs -filter-workspace="$SCALR_WORKSPACE_ID" > runs.json
          jq -e 'length == 0' runs.json >/dev/null
          rm -f runs.json
